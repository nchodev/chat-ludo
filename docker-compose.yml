# Usage: cp .env.example .env, adjust the URLs, then `docker compose up -d --build`.
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      CORS_ORIGIN: ${WEB_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - ludo-data:/data
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${SERVER_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  ludo-data:
