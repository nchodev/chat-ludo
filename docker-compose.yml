# Usage: cp .env.example .env, fill it in, then `docker compose up -d --build`.
# Only Caddy is reachable from outside (ports 80/443); the apps stay on the internal network.
services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?}
      WEB_DOMAIN: ${WEB_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - server
      - admin
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      WEB_URL: https://${WEB_DOMAIN}
      CORS_ORIGIN: https://${WEB_DOMAIN},https://${ADMIN_DOMAIN}
      TRUST_PROXY: "1"
    volumes:
      - ludo-data:/data
    expose:
      - "4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: https://${API_DOMAIN}
    expose:
      - "3000"
    depends_on:
      - server
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: https://${API_DOMAIN}
    expose:
      - "3001"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  ludo-data:
  caddy-data:
  caddy-config:
